[package]
name = "herald-core"
description = "Core library for Herald"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
aether-crds = { path = "../aether-crds" }
# Only to tell a version from a branch name before reporting it: an unparseable
# tag is not a claim about a version and is dropped rather than sent.
semver = "1.0"
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
reqwest = { version = "0.12.24", features = ["json"] }
lapin = "2"
aether-amqp = { path = "../aether-amqp" }
tokio = { version = "1.49.0", features = ["sync", "rt", "time", "macros", "net"] }
tracing = "0.1"
futures = "0.3"
kube = { version = "2.0.1", features = ["client"] }
k8s-openapi = { version = "0.26.0", features = ["latest"] }
# The fingerprint hash. Not `DefaultHasher`: its output is not guaranteed
# stable across Rust releases, and a fingerprint written into a 30-day index
# must not change value because the toolchain moved.
sha2 = "0.10"
regex = "1"
axum = { version = "0.8.9", features = ["json"] }
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic", "gen-tonic-messages", "trace"] }
prost = "0.14.4"
tonic = "0.14.6"

[dev-dependencies]
mockall = "0.14.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "test-util"] }
httpmock = "0.7.0"
tokio-stream = { version = "0.1.19", features = ["net"] }
