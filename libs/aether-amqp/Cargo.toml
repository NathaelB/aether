[package]
name = "aether-amqp"
description = "Connecting to the broker, and waiting for it when it is not there yet"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
lapin = "2"
tokio = { version = "1.49.0", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time", "test-util"] }
