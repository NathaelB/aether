# The doc mapping frozen by issue #293. V1 writes these fields, V2 queries
# them, V4 (#297) adds the seventh (`fingerprint`) -- the field names and
# their roles do not change without touching every one of those.
#
# Quickwit cannot change a doc mapping in place. An index created by V1
# before `fingerprint` existed accepts documents carrying it -- `mode:
# lenient` below -- and silently leaves the field unindexed, since it is not
# yet part of the mapping the index was created with. Grouping against such
# an index returns nothing, with no error anywhere. There is no migration
# here: delete and recreate the affected index.
#
# This is a template, not something `quickwit index create` accepts as is:
# `{organisation_id}` is not a legal Quickwit index id on its own. Render it
# by substituting the organisation's UUID (lowercase, hyphenated) first, e.g.
#
#   organisation_id=11111111-1111-1111-1111-111111111111
#   sed "s/{organisation_id}/$organisation_id/" \
#     docker/quickwit/index-config.template.yaml > /tmp/logs-$organisation_id.yaml
#   quickwit index create --endpoint http://localhost:7280 \
#     --index-config /tmp/logs-$organisation_id.yaml
#
# Creation itself happens where V1 first needs it, not here -- see
# docs/log-search-index.md.
version: 0.7
index_id: logs-{organisation_id}

doc_mapping:
  # Lenient, not strict: a field V1 or a later version sends that is not one
  # of the six below is left unindexed rather than turning the whole
  # document into a rejected write.
  mode: lenient
  field_mappings:
    # The index timestamp field: what the time-bucketed histogram buckets
    # on, and what `retention` below prunes by.
    - name: timestamp
      type: datetime
      input_formats:
        - rfc3339
        - unix_timestamp
      fast: true
      fast_precision: seconds

    # The tenant. Filtered on exactly, never tokenized: "raw" indexes the
    # value whole, so a filter matches the id byte for byte rather than
    # matching on fragments a word tokenizer would split it into.
    - name: organisation_id
      type: text
      tokenizer: raw

    # Which deployment the line came from. Filtered on exactly, same
    # reasoning as organisation_id. Also faceted on (V2), which is why this
    # one is fast and organisation_id above is not: a terms aggregation
    # needs a fast field, and organisation_id never varies within one
    # organisation's own index, so there is nothing there to facet.
    - name: deployment_id
      type: text
      tokenizer: raw
      fast: true

    # The container the line came from. Faceted on -- same reasoning as
    # deployment_id above.
    - name: source
      type: text
      tokenizer: raw
      fast: true

    # The log level. Faceted on today; V2 also filters on it as a floor
    # (e.g. "warning and above"), which is the same fast, raw field.
    - name: level
      type: text
      tokenizer: raw
      fast: true

    # The line itself: the only field tokenized for full-text search rather
    # than matched whole.
    - name: message
      type: text
      tokenizer: default
      record: position

    # A hash of the message's normalised form, computed at ingest time
    # (herald-core::domain::log_index). Raw and fast for the same reason as
    # source/level above: grouping runs a terms aggregation on it.
    - name: fingerprint
      type: text
      tokenizer: raw
      fast: true

  timestamp_field: timestamp

# V1 stopped forcing a commit on every ingest call (#294): under continuous
# ingest across a fleet that published a split roughly every 500ms per
# deployment, which Quickwit's own docs call out as harmful. This is the
# bound instead -- a line is findable at most this long after Herald ships
# it, not immediately, and not left to Quickwit's own default.
indexing_settings:
  commit_timeout_secs: 30

search_settings:
  default_search_fields: [message]

# 30 days on this index, decided in #292 independently of backup retention --
# see docs/log-search-index.md.
retention:
  period: 30 days
  schedule: daily
