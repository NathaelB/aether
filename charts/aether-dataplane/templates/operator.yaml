{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-operator
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aether-dataplane.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "aether-dataplane.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "aether-dataplane.fullname" . }}-operator
      containers:
        - name: operator
          image: {{ include "aether-dataplane.image" (dict "root" . "component" "operator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ .Values.operator.logFilter | quote }}
            # Which Gateway tenant routes attach to. The operator refuses to
            # start without it rather than picking whichever Gateway it can
            # see: the wrong choice would show up as traffic going somewhere
            # unexpected, not as an error.
            - name: AETHER_GATEWAY_NAME
              value: {{ include "aether-dataplane.fullname" . }}
            - name: AETHER_GATEWAY_NAMESPACE
              value: {{ .Release.Namespace }}
            {{- if .Values.objectStore.enabled }}
            # Where archives go. The operator writes these into a secret in each
            # tenant namespace, because CloudNativePG resolves secret references
            # inside the cluster's own namespace and there is no arrangement
            # where one secret here serves every tenant.
            #
            # A data plane without these archives nothing. That is a decision an
            # installation can make, and the operator says so once at startup
            # rather than failing per instance.
            - name: OBJECT_STORE_ENDPOINT
              value: {{ .Values.objectStore.endpoint | quote }}
            - name: OBJECT_STORE_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.credentialsSecret }}
                  key: ACCESS_KEY_ID
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.credentialsSecret }}
                  key: ACCESS_SECRET_KEY
            {{- end }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
{{- end }}
