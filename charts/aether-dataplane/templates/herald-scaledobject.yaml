{{- if and .Values.herald.enabled .Values.herald.keda.enabled }}
# Holds Herald's replica floor. KEDA owns the Deployment's replicas, which is
# why herald.yaml does not set them here. Whether KEDA restores a Deployment
# someone scaled to 0 is the behaviour to confirm on a real cluster.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-herald
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: herald
spec:
  scaleTargetRef:
    name: {{ include "aether-dataplane.fullname" . }}-herald
  minReplicaCount: {{ .Values.herald.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.herald.keda.maxReplicaCount }}
  triggers:
    {{- toYaml .Values.herald.keda.triggers | nindent 4 }}
{{- end }}
