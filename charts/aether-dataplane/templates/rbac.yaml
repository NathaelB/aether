{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-operator
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
---
# Cluster-scoped because the operator watches IdentityInstance resources in
# every namespace: a data plane hosts one namespace per deployment.
#
# The verbs are the ones the operator actually uses. It reads the CNPG
# connection Secret, creates the CNPG Cluster, the IAM Deployment, its Service,
# its Ingress and the schema migration Job -- and writes status and finalizers
# back onto the custom resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-operator
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["aether.dev"]
    resources: ["identityinstances", "identityinstanceupgrades"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aether.dev"]
    resources:
      - identityinstances/status
      - identityinstances/finalizers
      - identityinstanceupgrades/status
      - identityinstanceupgrades/finalizers
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-operator
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aether-dataplane.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "aether-dataplane.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
