{{- if .Values.genesis.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-genesis
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
---
# Genesis used to run as the operator's service account, which handed it every
# permission the operator needs -- deployments, jobs, secrets, ingresses -- to
# do a job that touches none of them. It writes `IdentityInstance` resources
# and the namespaces they live in. That is the whole list.
#
# Cluster-scoped because a data plane hosts one namespace per deployment, and
# Genesis is what creates them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-genesis
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
rules:
  # `patch` is what server-side apply needs; `create` is what it falls back to
  # when the namespace does not exist yet. `delete` is new for #185: a drill
  # builds its own throwaway namespace and removes the whole thing when it is
  # done, rather than deleting resources one at a time.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["aether.dev"]
    resources: ["identityinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # A drill (#185) reads the CloudNativePG connection secret for the
  # throwaway instance it just restored, to run a query against it directly.
  # Cluster-wide because a drill's namespace is generated per run and there is
  # no name to scope a Role to in advance -- the same reasoning Herald's own
  # Secret write was given a namespaced Role instead of, except here the name
  # is not knowable even after the fact. This is deliberately the widest grant
  # in this file: any Genesis pod can now read the CNPG credentials of every
  # instance on this data plane, not only the throwaway one it created.
  # Accepted for #185 because the alternative -- refusing to verify the
  # restored data plane actually answers a query -- was judged the worse
  # trade-off; read-only, and revisit if a way to scope it ever exists.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Genesis creates the upgrade and reads back the one already there to decide
  # whether a redelivery is a no-op or a conflict. It never writes status:
  # that is the operator's, and the two writing it would fight.
  - apiGroups: ["aether.dev"]
    resources: ["identityinstanceupgrades"]
    verbs: ["get", "list", "watch", "create"]
  # The recurring archive is applied beside the instance it belongs to, so it
  # is created and re-asserted the same way. Status stays the operator's.
  #
  # The one-off archive is applied the same way and for the same reason: an
  # action is delivered at least once, so the second delivery re-asserts the
  # resource the first created rather than making a second archive of the same
  # database. No delete: nothing Genesis does removes an archive somebody
  # asked for, and retention is the operator's.
  - apiGroups: ["aether.dev"]
    resources: ["identityinstancebackupschedules", "identityinstancebackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-genesis
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aether-dataplane.fullname" . }}-genesis
subjects:
  - kind: ServiceAccount
    name: {{ include "aether-dataplane.fullname" . }}-genesis
    namespace: {{ .Release.Namespace }}
{{- end }}
---
{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-operator
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
---
# Cluster-scoped because the operator watches IdentityInstance resources in
# every namespace: a data plane hosts one namespace per deployment.
#
# The verbs are the ones the operator actually uses. It reads the CNPG
# connection Secret, creates the CNPG Cluster, the IAM Deployment, its Service,
# its Ingress and the schema migration Job -- and writes status and finalizers
# back onto the custom resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-operator
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["aether.dev"]
    resources:
      - identityinstances
      - identityinstanceupgrades
      - identityinstancebackups
      - identityinstancebackupschedules
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aether.dev"]
    resources:
      - identityinstances/status
      - identityinstances/finalizers
      - identityinstanceupgrades/status
      - identityinstanceupgrades/finalizers
      - identityinstancebackups/status
      - identityinstancebackupschedules/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # deletecollection, not just delete: migration jobs are named per version and
  # torn down by label selector, because the names of the versions an instance
  # has passed through are not knowable from the instance being deleted.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kept while instances created before the move to Gateway API still carry
  # one. The operator deletes those as it reconciles them, and cannot delete
  # what it may not see.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only on gateways: the operator attaches routes to the Gateway this
  # chart declares, it never edits the edge itself.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses"]
    verbs: ["get", "list", "watch"]
  # SecurityPolicy carries a deployment's allow list, one per tenant route.
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The archive kinds are CloudNativePG's work: the operator creates them from
  # the Aether ones and reads their status back. It never deletes a Backup --
  # deleting one is how archives are lost, and nothing in a reconcile loop
  # should be able to.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups", "scheduledbackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Both groups. The recorder writes through events.k8s.io, and granting only
  # the core group left every status change logging a 403 that looked like a
  # reconcile failure and was not.
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-operator
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aether-dataplane.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "aether-dataplane.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
---
{{- if .Values.herald.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-herald
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
---
# Herald reads pod logs so a customer can watch their own instance from the
# console, and its own Gateway so it can report where this data plane can be
# reached. The only thing it writes to the cluster is its own Gateway's TLS
# secret, and only when the chart is configured to let it -- see the
# namespaced Role below, not this one. Everything else it does write goes to
# the control plane over HTTP.
#
# Cluster-scoped because a data plane hosts one namespace per deployment, and
# Herald serves all of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-herald
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
rules:
  # `pods` to find the containers of a deployment, `pods/log` to read them.
  # Both are needed: without the first there is nothing to ask the second for.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Herald is the only component holding credentials for the control plane, so
  # it is the one that says what this cluster archived. Read only: it reports
  # what the operator recorded and never writes it.
  - apiGroups: ["aether.dev"]
    resources: ["identityinstancebackups"]
    verbs: ["get", "list", "watch"]
  # Read-only, same as the operator's: Herald reads back the address of the
  # Gateway this chart declares, it never edits the edge itself.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-herald
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aether-dataplane.fullname" . }}-herald
subjects:
  - kind: ServiceAccount
    name: {{ include "aether-dataplane.fullname" . }}-herald
    namespace: {{ .Release.Namespace }}
{{- if and .Values.gateway.tls.secretName .Values.gateway.tls.managed }}
---
# Namespaced, unlike everything else Herald holds: this is the one write it
# does, and cluster-wide access to secrets would reach every tenant
# namespace's own -- database credentials included -- for a Gateway
# certificate that only ever lives beside Herald itself.
#
# `create` cannot be restricted to one name -- Kubernetes has nothing yet to
# check the name against -- so the first write after a fresh install needs
# it unscoped within this namespace. Every write after that is restricted to
# exactly the one Secret this chart was told to manage.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-herald-gateway-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.gateway.tls.secretName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aether-dataplane.fullname" . }}-herald-gateway-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aether-dataplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aether-dataplane.fullname" . }}-herald-gateway-tls
subjects:
  - kind: ServiceAccount
    name: {{ include "aether-dataplane.fullname" . }}-herald
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
