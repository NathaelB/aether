# Images are published by CI as ghcr.io/nathaelb/aether-<component>.
image:
  registry: ghcr.io
  repository: nathaelb
  # Empty means "use the chart's appVersion". Pin it for anything but a local
  # experiment: a data plane silently tracking :latest is a data plane whose
  # version nobody can state.
  tag: ""
  pullPolicy: IfNotPresent

# What identifies this data plane to the control plane.
dataplane:
  # Required. The id the control plane registered for this cluster; Herald
  # claims actions for it and reports its heartbeat against it.
  id: ""
  # Herald shards the deployments it owns by hashing their id. One replica per
  # shard, each with its own index.
  shard:
    id: 0
    total: 1

controlPlane:
  # Required. Reachable from inside the cluster. For a control plane running on
  # the developer's machine against a k3d cluster, that is
  # http://host.k3d.internal:3333.
  url: ""
  # How Herald authenticates. Prefer client credentials: the control plane
  # checks token expiry, so a fixed token stops working with no way for Herald
  # to recover.
  auth:
    # OIDC issuer, e.g. https://id.example/realms/aether. Leave empty to fall
    # back to the fixed token below.
    issuer: ""
    clientId: herald-service
    clientSecret: ""

  # A fixed bearer token. Fine for a short local run, wrong for anything that
  # outlives it.
  #
  # `token` and `auth.clientSecret` are written into a Secret by this chart;
  # `existingSecret` points at one you manage instead. Never both.
  token: ""
  existingSecret: ""
  existingSecretKey: token
  existingSecretClientSecretKey: client-secret

herald:
  enabled: true
  replicaCount: 1
  pollIntervalSeconds: 15
  claim:
    max: 50
    leaseSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

genesis:
  enabled: true
  replicaCount: 1
  queue: genesis.actions
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

operator:
  enabled: true
  replicaCount: 1
  logFilter: info
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# A single-node broker, adequate for a local cluster and nothing else. Point
# `externalUrl` at a real broker and set `enabled: false` for anything durable:
# this one loses every queued action when its pod restarts.
rabbitmq:
  enabled: true
  image: rabbitmq:4-management
  externalUrl: ""
  auth:
    username: aether
    password: aether
  exchange: aether.actions
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# The shared edge every managed instance is served through. Envoy Gateway
# provisions one Envoy deployment per Gateway, so this data plane runs one and
# tenant routes attach to it.
#
# Envoy Gateway itself is a cluster prerequisite, like CloudNativePG: this
# chart declares the Gateway, it does not install the controller.
gateway:
  enabled: true
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  replicaCount: 1
  service:
    # Every instance is served through a route now, so the Gateway is the edge
    # and takes the node's ports. A cluster still running an ingress
    # controller on 80 has to lose it, or this service stays Pending: two
    # LoadBalancers cannot both hold the port, and the loser says nothing.
    type: LoadBalancer
  tls:
    # A Secret holding the certificate for the HTTPS listener. Empty means no
    # HTTPS listener at all, rather than one that terminates with nothing:
    # a listener that cannot resolve its certificate takes the whole Gateway
    # out of Programmed, including the plain HTTP listener beside it.
    secretName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

nameOverride: ""
fullnameOverride: ""

# Where this data plane archives the databases it hosts.
#
# Disabled means this data plane backs nothing up, which is a decision rather
# than an oversight: the operator logs it once at startup and carries on. It is
# a different state from a store being unreachable, and the two are reported
# differently.
#
# The credentials live in a secret this chart does not create. It holds
# ACCESS_KEY_ID and ACCESS_SECRET_KEY, and the operator copies it into each
# tenant namespace because CloudNativePG resolves secret references inside the
# cluster's own namespace.
objectStore:
  enabled: false
  # Where the store answers. Empty means AWS, which is the only one that needs
  # no endpoint.
  endpoint: ""
  # Signed into every request. Self hosted stores mostly ignore which region it
  # is and mind very much that there is one.
  region: us-east-1
  credentialsSecret: aether-object-store
