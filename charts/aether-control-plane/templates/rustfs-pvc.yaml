{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aether-control-plane.fullname" . }}-rustfs
  labels:
    {{- include "aether-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.rustfs.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rustfs.storage.size }}
{{- end }}
