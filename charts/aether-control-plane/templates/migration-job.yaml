apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aether-control-plane.fullname" . }}-migrations
  labels:
    {{- include "aether-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # Sync, not PreSync: a PreSync hook runs before *any* regular resource is
    # applied, including the CNPG Cluster this Job needs to already exist.
    # Sync hooks run interleaved with regular resources by sync-wave instead,
    # so wave -2 (the Cluster, RustFS) is applied, then this hook runs and is
    # waited on, then wave 0 (the Deployments) follows.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    # A fresh Job every sync, not one ArgoCD tries to patch in place: a Job's
    # spec is immutable once created, and a stale one from the previous sync
    # would fail to apply rather than run again.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "aether-control-plane.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      initContainers:
        # The CNPG Cluster resource exists the moment this Job's Pod is
        # scheduled, but Postgres itself takes tens of seconds to come up on
        # a first install. Waiting here is simpler than a readiness probe
        # with no long-running container to attach one to.
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DATABASE_HOST" -p "$DATABASE_PORT" -U "$DATABASE_USER"; do
                echo "waiting for postgres at $DATABASE_HOST:$DATABASE_PORT"
                sleep 2
              done
          env:
            - name: DATABASE_HOST
              value: {{ include "aether-control-plane.postgresqlHost" . | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: DATABASE_USER
              value: {{ .Values.database.user | quote }}
      containers:
        - name: migrate
          image: {{ include "aether-control-plane.image" (dict "root" . "component" "control-plane" "tag" .Values.image.controlPlaneTag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sqlx
          args:
            - migrate
            - run
            - --source
            - /usr/local/src/aether/migrations
          env:
            # Order matters: $(...) below only resolves names already
            # defined earlier in this list.
            - name: DATABASE_USER
              value: {{ .Values.database.user | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aether-control-plane.postgresqlSecretName" . }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
            - name: DATABASE_URL
              value: {{ printf "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@%s:%s/$(DATABASE_NAME)" (include "aether-control-plane.postgresqlHost" .) (.Values.database.port | toString) | quote }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
