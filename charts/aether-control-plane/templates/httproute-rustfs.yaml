{{- if and .Values.rustfs.enabled .Values.gatewayApi.rustfs.enabled }}
{{- if not .Values.gatewayApi.rustfs.hostname }}
{{- fail "gatewayApi.rustfs.hostname is required when gatewayApi.rustfs.enabled is true" }}
{{- end }}
{{- if not .Values.gatewayApi.rustfs.parentRefs }}
{{- fail "gatewayApi.rustfs.parentRefs is required when gatewayApi.rustfs.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aether-control-plane.fullname" . }}-rustfs
  labels:
    {{- include "aether-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  hostnames:
    - {{ .Values.gatewayApi.rustfs.hostname | quote }}
  parentRefs:
    {{- toYaml .Values.gatewayApi.rustfs.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "aether-control-plane.fullname" . }}-rustfs
          port: 9000
{{- end }}
