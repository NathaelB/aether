{{- if .Values.gatewayApi.api.enabled }}
{{- if not .Values.gatewayApi.api.hostname }}
{{- fail "gatewayApi.api.hostname is required when gatewayApi.api.enabled is true" }}
{{- end }}
{{- if not .Values.gatewayApi.api.parentRefs }}
{{- fail "gatewayApi.api.parentRefs is required when gatewayApi.api.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aether-control-plane.fullname" . }}-api
  labels:
    {{- include "aether-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  hostnames:
    - {{ .Values.gatewayApi.api.hostname | quote }}
  parentRefs:
    {{- toYaml .Values.gatewayApi.api.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "aether-control-plane.fullname" . }}
          port: {{ .Values.controlPlane.server.port }}
{{- end }}
