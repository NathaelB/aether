{{- if .Values.gatewayApi.console.enabled }}
{{- if not .Values.gatewayApi.console.hostname }}
{{- fail "gatewayApi.console.hostname is required when gatewayApi.console.enabled is true" }}
{{- end }}
{{- if not .Values.gatewayApi.console.parentRefs }}
{{- fail "gatewayApi.console.parentRefs is required when gatewayApi.console.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aether-control-plane.fullname" . }}-console
  labels:
    {{- include "aether-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  hostnames:
    - {{ .Values.gatewayApi.console.hostname | quote }}
  parentRefs:
    {{- toYaml .Values.gatewayApi.console.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "aether-control-plane.fullname" . }}-console
          port: 80
{{- end }}
