apiVersion: aether.dev/v1alpha
kind: IdentityInstance
metadata:
  name: cloud-iam-ferriskey
  namespace: test-aether
spec:
  organisationId: org-123
  provider: ferriskey
  version: "0.5.0"
  hostname: ferriskey.aether.local
  ferriskey:
    webappUrl: "https://ferriskey.aether.local"
    apiBaseUrl: "https://ferriskey.aether.local/api"
  # Served through an HTTPRoute on the data plane's Gateway. Drop this block
  # entirely to be exposed, which is the default; set enabled: false for an
  # instance that should only be reachable from inside the cluster.
  ingress:
    enabled: true
  database:
    mode: managedCluster
    managedCluster:
      instances: 1
      storage:
        size: "1Gi"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
