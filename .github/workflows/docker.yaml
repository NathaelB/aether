name: docker

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
      - v*.*.*-rc*

  # Deliberately unfiltered by base branch. Stacked work targets the previous
  # branch in the chain rather than main, and `branches: [main]` meant every
  # PR in such a chain merged with no CI having run on it at all.
  pull_request:
    paths:
      - .github/workflows/docker.yaml
      - apps/**
      - libs/**
      - charts/**
      - docker/**
      - Dockerfile
      - Cargo.*
      - .sqlx/**
  workflow_dispatch:
    inputs:
      push:
        type: boolean
        default: false
        description: "Whether to push the image"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --all-features
  # Every rule that lives in SQL was untested: the repository tests skip
  # themselves when DATABASE_URL is unset, and it was unset here, so they
  # reported success without running.
  integration-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aether:aether@localhost:5432/aether
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: Migrate
        run: sqlx migrate run --source libs/aether-core/migrations

      # A stale offline cache compiles against a schema that no longer exists,
      # and the failure surfaces at runtime rather than here.
      - name: The committed .sqlx matches the schema
        run: cargo sqlx prepare --workspace --check -- --all-targets

      # REQUIRE_DATABASE_URL turns a skip into a failure. Without it, losing
      # the service container would put this job straight back to reporting
      # success without running anything -- the exact shape of the bug.
      - name: Repository tests
        run: cargo test -p aether-postgres --tests
        env:
          SQLX_OFFLINE: "true"
          REQUIRE_DATABASE_URL: "1"

  # Same lesson as integration-postgres, for the object store and the key
  # manager. These tests skip themselves when their endpoint is unset, so
  # without service containers they would report success having exercised
  # nothing -- and what they cover is exactly what a mock cannot answer: path
  # style addressing, absence of a key, prefix listing, whether the store
  # applies the rules it was asked for, and whether a rotation leaves an
  # archive taken before it still readable.
  integration-services:
    runs-on: ubuntu-24.04
    services:
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: aether
          RUSTFS_SECRET_KEY: aetheraether
          RUSTFS_VOLUMES: /data
          # Without a master key the store refuses every encrypted write rather
          # than quietly storing plaintext, which is the right failure and the
          # reason this has to be set here as well as in compose. Not a secret:
          # it is the local stand-in for a provider held key.
          RUSTFS_SSE_S3_MASTER_KEY: YWV0aGVyLWxvY2FsLXNzZS1tYXN0ZXIta2V5LTAwMzI=
        ports:
          - 9000:9000
      openbao:
        image: openbao/openbao:latest
        env:
          BAO_DEV_ROOT_TOKEN_ID: aether-root
        ports:
          - 8200:8200
    env:
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_ACCESS_KEY: aether
      OBJECT_STORE_SECRET_KEY: aetheraether
      KEY_MANAGER_ADDRESS: http://localhost:8200
      KEY_MANAGER_TOKEN: aether-root
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Neither image ships a health check, and an S3 endpoint answers an
      # unauthenticated request with 403, so "answers at all" is the condition
      # rather than a successful status.
      - name: Wait for the services
        run: |
          wait_for() {
            for _ in $(seq 1 30); do
              curl -s -o /dev/null --max-time 2 "$2" && return 0
              sleep 2
            done
            echo "$1 never answered at $2"
            return 1
          }
          wait_for "the object store" http://localhost:9000
          wait_for "the key manager" http://localhost:8200/v1/sys/health

      # The REQUIRE_ variables turn a skip into a failure, so losing a service
      # container cannot put this job back to reporting success without running
      # anything.
      - name: Object store tests
        run: |
          cargo test -p aether-s3 --test object_store
          cargo test -p aether-api --test archive_bucket
        env:
          SQLX_OFFLINE: "true"
          REQUIRE_OBJECT_STORE_ENDPOINT: "1"

      - name: Key manager tests
        run: |
          cargo test -p aether-transit --test key_provider
          cargo test -p aether-api --test wrapping_key
        env:
          SQLX_OFFLINE: "true"
          REQUIRE_KEY_MANAGER_ADDRESS: "1"

  coverage-rust:
    runs-on: ubuntu-24.04
    needs: quality-rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Rust coverage
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude aether-postgres \
            --exclude aether-control-plane \
            --exclude aether-operator \
            --all-features \
            --ignore-filename-regex '(^|/)(apps/control-plane|apps/operator|libs/aether-postgres)(/|$)' \
            --fail-under-lines 50
  security-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # --locked, so the tool is built from the dependency tree its authors
      # tested rather than from whatever resolves today. Without it a
      # transitive crate published this morning takes the job down for a
      # reason that has nothing to do with this repository, which is what
      # happened: jiff 0.2.36 ships include_str! paths pointing outside its
      # own package and does not compile at all.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust CVE audit
        run: cargo audit
  chart-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up helm
        uses: azure/setup-helm@v4

      - name: lint
        run: helm lint charts/aether-dataplane

      # Linting only proves the chart parses. Rendering with the values a real
      # install needs is what catches a template that is valid YAML and wrong
      # Kubernetes -- and it exercises the guards that refuse to install a data
      # plane with no id or no control plane.
      - name: render with required values
        run: |
          helm template aether charts/aether-dataplane \
            --set dataplane.id=11111111-1111-1111-1111-111111111111 \
            --set controlPlane.url=http://control-plane:3333 \
            --set controlPlane.token=ci \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: reject an install that cannot work
        run: |
          if helm template aether charts/aether-dataplane >/dev/null 2>&1; then
            echo "::error::the chart rendered without a dataplane id or control plane URL"
            exit 1
          fi

  build:
    needs:
      - quality-rust
      - coverage-rust
      - security-rust
    runs-on: ${{ matrix.runner.name }}
    strategy:
      # One failing target used to cancel the other four before they finished,
      # which is how a pull request ended up unable to ever show a green build
      # even though only the console was broken.
      fail-fast: false
      matrix:
        runner:
          - name: ubuntu-24.04
            platform: linux/amd64
          - name: ubuntu-24.04-arm
            platform: linux/arm64
        target:
          - control-plane
          - console
          - genesis
          - herald
          - operator
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: cache layers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: buildx-${{ runner.arch }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.arch }}-${{ matrix.target }}-

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nathaelb/aether-${{ matrix.target }}

      - name: log-in to ghcr
        if: inputs.push || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.runner.platform }}
          tags: ghcr.io/nathaelb/aether-${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ inputs.push || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch }}

      - name: prepare digest
        id: digest
        if: inputs.push || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: upload digest
        if: inputs.push || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ runner.arch }}-${{ matrix.target }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: move cache
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache-new ${{ runner.temp }}/.buildx-cache

  push-manifest:
    if: inputs.push || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - control-plane
          - console
          - genesis
          - herald
          - operator
    steps:
      - name: set up builx
        uses: docker/setup-buildx-action@v3

      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.target }}
          merge-multiple: true

      - name: log-in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: get image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nathaelb/aether-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf 'ghcr.io/nathaelb/aether-${{ matrix.target }}@sha256:%s ' *)
