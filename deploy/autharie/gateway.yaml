# The entry point for everything on autharie.fr: the console+API
# (charts/aether-control-plane's HTTPRoute) and the dedicated Ferriskey
# (deploy/autharie/ferriskey-values-production.yaml's HTTPRoute) both attach
# to this Gateway's autharie-https listener.
#
# Applied directly with kubectl, same as ferrislabs-gateway and the other
# Gateways on this cluster -- none of them are ArgoCD-managed, and there is
# no reason for this one to be the exception.
#
# The cluster-issuer annotation is what every other Gateway here carries too,
# but none of their Certificates carry an ownerReference back to a Gateway --
# gateway-shim isn't what's issuing them. The Certificate below is what
# actually does it, same as ferrislabs-fr-tls.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: autharie-gateway
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
spec:
  gatewayClassName: eg
  listeners:
    - name: autharie-http
      port: 80
      protocol: HTTP
      hostname: "*.autharie.fr"
      allowedRoutes:
        namespaces:
          from: All
    - name: autharie-https
      port: 443
      protocol: HTTPS
      hostname: "*.autharie.fr"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: autharie-fr-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: autharie-fr-tls
  namespace: default
spec:
  secretName: autharie-fr-tls
  dnsNames:
    - autharie.fr
    - "*.autharie.fr"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-internal
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: autharie-https-redirect
  namespace: default
spec:
  hostnames:
    - "*.autharie.fr"
  parentRefs:
    - name: autharie-gateway
      sectionName: autharie-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
