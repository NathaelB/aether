# Production values for the Ferriskey instance dedicated to Autharie: its
# IAM, not the platform's own. No secret ever belongs in this file -- see
# docs/production-deployment.md.

publicHost: id.autharie.fr

# The chart's own toy Postgres is explicitly "not recommended in production"
# -- CNPG (deploy/autharie/ferriskey-db/cluster.yaml) is used instead, same
# as every other database on this cluster.
postgresql:
  enabled: false

database:
  host: autharie-ferriskey-db-rw.autharie-ferriskey.svc.cluster.local
  name: ferriskey
  user: ferriskey
  passwordSecret:
    create: false
    # The Secret CNPG generates for the Cluster below.
    name: autharie-ferriskey-db-app
    key: password

api:
  server:
    # The console's origin, not Ferriskey's own: it is the console's
    # browser-side JS that calls here cross-origin for token exchange and
    # userinfo.
    allowedOrigins:
      - https://app.autharie.fr
  admin:
    email: admin@autharie.fr
    username: admin
    # Auto-generated on first install -- read once from the
    # `autharie-ferriskey-api-admin` Secret this creates, per the runbook.
    passwordSecret:
      create: true
  webapp:
    url: https://id.autharie.fr

gatewayAPI:
  httpRoute:
    enabled: true
    parentRefs:
      - name: autharie-gateway
        namespace: default
        sectionName: autharie-https
