# The realm and OIDC clients Aether needs, as a description rather than a
# sequence of API calls.
#
# Applied with `ferris-ctl realm import --from config`, which is FerrisKey's own
# tool: it knows the API, it supports a --dry-run, and it handles redirect URIs
# and roles that a hand-rolled script would have to reimplement and keep in step.
name: aether

settings:
  # Short-lived tokens are the reason Herald refreshes rather than holding one:
  # the control plane checks `exp`, so a fixed token dies quietly.
  access_token_lifetime: 300
  refresh_token_lifetime: 1800
  user_registration_enabled: false
  forgot_password_enabled: true

clients:
  # The web console. Public because a browser cannot keep a secret.
  - client_id: console
    name: Aether Console
    client_type: public
    public_client: true
    direct_access_grants_enabled: true
    redirect_uris:
      - http://localhost:5173
      - http://localhost:5173/*
      - http://localhost:5556
      - http://localhost:5556/*

  # Herald authenticates as itself, with no user involved. The control plane
  # rejects any caller whose client id does not contain "herald-service", so
  # this name is a contract rather than a preference.
  - client_id: herald-service
    name: Herald
    client_type: confidential
    public_client: false
    service_account_enabled: true
    direct_access_grants_enabled: false
