version: "3.8"

services:
  # === PostgreSQL Database (shared by Aether and Ferriskey) ===
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    ports:
      - "${AETHER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - aether
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
        - -U
        - aether
        - -d
        - aether
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  # === Aether Services ===
  aether-migrations:
    build:
      context: .
      target: control-plane
    networks:
      - aether
    entrypoint:
      - sqlx
    command:
      - migrate
      - run
      - --source
      - /usr/local/src/aether/migrations
    environment:
      DATABASE_URL: postgresql://aether:aether@postgres/aether
    restart: no
    depends_on:
      postgres:
        condition: service_healthy

  aether:
    build:
      context: .
      target: control-plane
    ports:
      - "${AETHER_API_PORT:-7777}:7777"
    networks:
      - aether
    environment:
      # 3333, not 3334: the "3334:3333" mapping is for reaching Ferriskey from
      # the host. Inside this network the container port is what counts, and
      # the wrong one meant the control plane could not fetch the JWKS -- so
      # every authenticated request failed with what looked like a bad token.
      AUTH_ISSUER: http://ferriskey-api:3333/realms/aether
      # Without this the CORS layer allows no origin at all, and the console
      # cannot call the API. It has been required since the origins became
      # configurable rather than hardcoded to localhost:5173.
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5556
      SERVER_PORT: 7777
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: aether
      DATABASE_USER: aether
      DATABASE_PASSWORD: aether
      # 9000, not 9800: the published port is for reaching RustFS from the
      # host. Inside this network the container port is what counts, the same
      # way it is for Ferriskey above.
      OBJECT_STORE_ENDPOINT: http://rustfs:9000
      OBJECT_STORE_BUCKET: aether-backups
      OBJECT_STORE_ACCESS_KEY: aether
      OBJECT_STORE_SECRET_KEY: aetheraether
      KEY_MANAGER_ADDRESS: http://openbao:8200
      KEY_MANAGER_TOKEN: aether-root
      KEY_MANAGER_KEY: aether-backups
      # Not a `depends_on`: an unreachable Quickwit is a search that fails, not
      # a control plane that refuses to start.
      QUICKWIT_URL: http://quickwit:7280
      # Who may operate this installation before anybody has been granted it.
      # Platform rights are handed out by somebody who already holds one, which
      # is a chain with no first link on a fresh database. Set by demo.sh to
      # the subject of whoever ran it; empty here so a checkout that starts
      # Compose by hand says in its logs that nobody can operate it, rather
      # than silently granting a subject nobody chose.
      AETHER_BOOTSTRAP_OPERATOR: ${AETHER_BOOTSTRAP_OPERATOR:-}
      # The one administrative thing the control plane does to the realm:
      # create the client a data plane's Herald authenticates as, when that
      # data plane is registered. On a real installation these are a client
      # scoped to managing clients; here they are the admin account, like every
      # other credential in this file.
      REALM_ADMIN_URL: http://ferriskey-api:3333
      REALM_ADMIN_USERNAME: ${FERRISKEY_ADMIN_USER:-admin}
      REALM_ADMIN_PASSWORD: ${FERRISKEY_ADMIN_PASSWORD:-admin}
    depends_on:
      aether-migrations:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      openbao:
        condition: service_healthy

  # === Ferriskey Services ===
  ferriskey-migrations:
    image: ghcr.io/ferriskey/ferriskey-api:latest
    profiles:
      - ferriskey
    networks:
      - aether
    entrypoint:
      - sqlx
    command:
      - migrate
      - run
      - --source
      - /usr/local/src/ferriskey/migrations
    environment:
      DATABASE_URL: postgresql://aether:aether@postgres/ferriskey
    restart: no
    depends_on:
      postgres:
        condition: service_healthy

  ferriskey-api:
    image: ghcr.io/ferriskey/ferriskey-api:latest
    profiles:
      - ferriskey
    networks:
      - aether
    environment:
      ALLOWED_ORIGINS: http://localhost:5556,http://localhost:5173
      WEBAPP_URL: http://localhost:5556
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ferriskey
      DATABASE_PASSWORD: aether
      DATABASE_USER: aether
    ports:
      - "${FERRISKEY_API_PORT:-3334}:3333"
    depends_on:
      ferriskey-migrations:
        condition: service_completed_successfully

  ferriskey-webapp:
    image: ghcr.io/ferriskey/ferriskey-webapp:latest
    profiles:
      - ferriskey
    networks:
      - aether
    environment:
      API_URL: http://localhost:3334
    ports:
      - "${FERRISKEY_WEBAPP_PORT:-5556}:80"
    depends_on:
      - ferriskey-api

  # === Key manager ===
  # Transit is the engine every key manager this platform talks to looks like:
  # wrap a small payload, unwrap it, generate a data key. Running the real
  # interface locally is the point. An adapter shaped against a key in an
  # environment variable would have to be redesigned at the first real manager,
  # and that is exactly when nobody has time for it.
  #
  # Dev mode: in memory, unsealed, one known root token. Fine for a throwaway
  # stack and for nothing else.
  openbao:
    image: openbao/openbao:latest
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: aether-root
    ports:
      - "${OPENBAO_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - aether
    healthcheck:
      test:
        - CMD-SHELL
        - "bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1 || exit 1"
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s

  # === Object storage ===
  # The archive target every data plane writes to. RustFS speaks S3, so the
  # adapter exercised here is the one that runs against Scaleway later: there
  # is no development-only code path to diverge.
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      # 9800, not 9000: 9000 is the port every object store in every other
      # project on the machine also picks, and a bucket that answers on it is
      # very likely not this one. The container port stays 9000, so nothing
      # inside the network has to know.
      - "${RUSTFS_PORT:-9800}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9801}:9001"
    environment:
      RUSTFS_ACCESS_KEY: aether
      RUSTFS_SECRET_KEY: aetheraether
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
      # Server side encryption needs a master key, and without one RustFS
      # refuses every encrypted write rather than quietly storing it in the
      # clear. A fixed value for a throwaway stack: this is the local
      # equivalent of the provider held key a real bucket uses, and it is not
      # the key story this platform sells. See docs/local-development.md.
      RUSTFS_SSE_S3_MASTER_KEY: YWV0aGVyLWxvY2FsLXNzZS1tYXN0ZXIta2V5LTAwMzI=
    volumes:
      - rustfsdata:/data
    networks:
      - aether
    healthcheck:
      # Answering at all is health. Not `curl -f`: an S3 endpoint answers an
      # unauthenticated GET with 403, which -f turns into a failure, and the
      # container sits unhealthy for ever while serving perfectly. The control
      # plane waits on this condition, so a check that can never pass is a
      # `make demo` that never comes up.
      test:
        - CMD-SHELL
        - "curl -s -o /dev/null --max-time 3 http://localhost:9000"
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  # === Search index bootstrap ===
  # Quickwit's own S3 client expects the bucket to already exist -- unlike
  # aether-s3's ensure_bucket, it never creates one itself. A one-shot step,
  # the way aether-migrations is one, rather than teaching Quickwit's own
  # config how to create a bucket it was never asked to own.
  quickwit-bucket:
    # quay.io, not docker.io: Docker Hub stopped serving the minio/mc
    # namespace; quay.io/minio/mc is the same image under the same tags.
    image: quay.io/minio/mc:latest
    networks:
      - aether
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set store http://rustfs:9000 aether aetheraether; do
          echo "waiting for rustfs"
          sleep 2
        done
        mc mb --ignore-existing store/aether-logs
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # === Search index (Quickwit) ===
  # V0 of the logs chantier (#293): an index Herald can write to, not yet
  # written to by anything. A separate bucket from aether-backups, not a
  # prefix inside it -- see docs/log-search-index.md for why.
  quickwit:
    image: quickwit/quickwit:0.9.0
    command:
      - run
    ports:
      - "${QUICKWIT_PORT:-7280}:7280"
    environment:
      AWS_ACCESS_KEY_ID: aether
      AWS_SECRET_ACCESS_KEY: aetheraether
    volumes:
      - ./docker/quickwit/config.yaml:/quickwit/config/quickwit.yaml:ro
      - quickwitdata:/quickwit/qwdata
    networks:
      - aether
    depends_on:
      quickwit-bucket:
        condition: service_completed_successfully
    healthcheck:
      # Quickwit's own binary, because the image ships no curl, wget or nc: a
      # curl-based probe exits 127 forever and leaves the container unhealthy
      # while the service answers perfectly well. Listing indexes goes through
      # the same API a search does, so it fails when the metastore is
      # unreachable rather than merely when the process is gone.
      test:
        - CMD-SHELL
        - "quickwit index list --endpoint http://localhost:7280 >/dev/null 2>&1"
      interval: 10s
      retries: 6
      start_period: 15s
      timeout: 5s

  # === RabbitMQ ===
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: aether
      RABBITMQ_DEFAULT_PASS: aether
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - aether
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - ping
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

networks:
  aether:
    driver: bridge

volumes:
  pgdata:
  rabbitmqdata:
  rustfsdata:
  quickwitdata:
